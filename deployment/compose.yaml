services:
  db:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment:
      POSTGRES_USER: sync
      POSTGRES_DB: sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/Start-Local.ps1 first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync"]
      interval: 3s
      retries: 20
  migrate:
    build: ../api
    environment:
      DATABASE_URL: postgresql+psycopg://sync:${POSTGRES_PASSWORD}@db/sync
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ../api
    environment:
      DATABASE_URL: postgresql+psycopg://sync:${POSTGRES_PASSWORD}@db/sync
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      ENABLE_DEVELOPMENT_TOOLS: "${ENABLE_DEVELOPMENT_TOOLS:-false}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: ../web
      args:
        PUBLIC_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    environment:
      API_INTERNAL_URL: http://api:8000
      PUBLIC_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: "1"
      ENABLE_LOCAL_TESTS: "${ENABLE_DEVELOPMENT_TOOLS:-false}"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
  test:
    profiles: ["test"]
    build: ../api
    environment:
      DATABASE_URL: postgresql+psycopg://sync:${POSTGRES_PASSWORD}@db/sync_test
      WEB_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      ENABLE_DEVELOPMENT_TOOLS: "true"
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
